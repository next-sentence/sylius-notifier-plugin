sylius_grid:
    grids:
        lwc_sylius_notifier_admin_notification:
            driver:
                name: doctrine/orm
                options:
                    class: '%lwc_sylius_notifier.model.notification.class%'
            sorting:
                startDate: desc
                priority: desc
            limits: [50]
            fields:
                code:
                    type: string
                    label: lwc_sylius_notifier.ui.code
                enabled:
                    type: twig
                    label: lwc_sylius_notifier.ui.enabled
                    options:
                        template: "@SyliusAdmin/shared/grid/field/boolean.html.twig"
                onlyLoggedInUsers:
                    type: twig
                    label: lwc_sylius_notifier.ui.only_logged_in_users
                    options:
                        template: "@SyliusAdmin/shared/grid/field/boolean.html.twig"
                priority:
                    type: string
                    label: lwc_sylius_notifier.ui.priority
                startDate:
                    type: datetime
                    label: lwc_sylius_notifier.ui.starts_at
                    options:
                        format: d-m-Y H:i:s
                endDate:
                    type: datetime
                    label: lwc_sylius_notifier.ui.ends_at
                    options:
                        format: d-m-Y H:i:s
            filters:
                search:
                    type: string
                    options:
                        fields: [code, description]
                enabled:
                    type: boolean
                onlyLoggedInUsers:
                    type: boolean
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
